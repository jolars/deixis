version: "3"

tasks:
  fmt:
    desc: Check Rust formatting.
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Lint all Rust targets.
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run all Rust tests.
    cmds:
      - cargo test --all-targets --locked

  benchmark-test:
    desc: Test the agent benchmark harness.
    cmds:
      - python3 -m unittest discover -s benchmarks/agent/tests -v

  compatibility:
    desc: Test against the real language-server compatibility matrix.
    cmds:
      - nix develop .#compatibility --command cargo test --test real_language_servers -- --ignored --test-threads=1

  docs:
    desc: Build Rust documentation.
    cmds:
      - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  check:
    desc: Run the same checks as CI.
    deps: [fmt, lint, test, benchmark-test, docs]
