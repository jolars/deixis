version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    # cargo-dist validates this generated workflow against its configuration.
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
