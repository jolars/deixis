[package]
name = "deixis"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "An MCP server for interacting with language servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/deixis"
readme = "README.md"
keywords = ["mcp", "lsp", "language-server", "code-intelligence"]
categories = ["development-tools"]

[dependencies]
globset = "0.4.20"
rmcp = { version = "3.2.0", default-features = false, features = [
    "server",
    "transport-io",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = "0.7.19"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.2.0", default-features = false, features = [
    "client",
    "transport-child-process",
] }
tokio = { version = "1.53.1", features = ["process", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
