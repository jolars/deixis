schema_version = 1

# Pin these for the entire experiment.
model = "gpt-5.6-sol"
reasoning_effort = "medium"
repetitions = 2
seed = 20260907
agent_timeout_seconds = 1200
evaluation_timeout_seconds = 1200

codex_command = "codex"
deixis_command = "../../target/release/deixis"
deixis_config = "../../examples/config.toml"

arms = [
  "control",
  "deixis_available",
  "instruction_only",
  "deixis_instructed",
]

instruction = """
When a task needs semantic code navigation and Deixis is available, try
`definition`, `type_definition`, `implementation`, or `references` for
the relevant question before using text search or reading broad file ranges.
Use ordinary repository tools to locate an initial file or symbol position
when needed. After editing code in a task with a semantic navigation need,
use `diagnostics` on the changed files to check for language-server errors,
and run the relevant tests. If the task has no semantic navigation need, no
Deixis call is required, including diagnostics. Use `document_symbols` only
when a file outline is needed; it is never a required step. If Deixis is
unavailable, a call fails, or its result does not answer the question, fall
back to ordinary repository tools.
"""

[environment]
RUST_BACKTRACE = "1"

[[tasks]]
id = "rust-cross-file"
repository = "/absolute/path/to/a/local/repository"
revision = "parent-of-the-fixing-commit"
prompt = """
Fix the bug described below. Add or update tests as appropriate, and run the
relevant test suite before finishing.

Paste the original issue statement here without file paths from the eventual
fix or other solution leakage.
"""
precheck_command = ["cargo", "test", "--test", "held_out_regression"]
expected_precheck_exit_code = 101
evaluation_command = ["cargo", "test", "--test", "held_out_regression"]
expected_evaluation_exit_code = 0
tags = ["rust", "semantic", "cross-file"]

[[tasks]]
id = "rust-local-control"
repository = "/absolute/path/to/a/second/local/repository"
revision = "parent-of-the-fixing-commit"
prompt_file = "tasks/rust-local-control.md"
evaluation_command = ["cargo", "test", "localized_regression"]
tags = ["rust", "localized", "control"]
